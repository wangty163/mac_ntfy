name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NtfyMac (macOS)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project NtfyMac.xcodeproj \
            -scheme NtfyMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build \
            | xcbeautify || \
          xcodebuild \
            -project NtfyMac.xcodeproj \
            -scheme NtfyMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

  archive:
    name: Archive .app artifact
    runs-on: macos-14
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Resolve build version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            MARKETING_VERSION="${VERSION#v}"
          else
            VERSION="dev-${GITHUB_RUN_NUMBER}"
            MARKETING_VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building artifact version: $VERSION"

      - name: Build Release (unsigned) into export dir
        run: |
          set -o pipefail
          xcodebuild \
            -project NtfyMac.xcodeproj \
            -scheme NtfyMac \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            NTFY_BUILD_VERSION_LABEL="${{ steps.version.outputs.version }}" \
            clean build

      - name: Stage app bundle
        run: |
          mkdir -p build/export
          APP_PATH="$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          echo "Found: $APP_PATH"
          cp -R "$APP_PATH" build/export/

      - name: Ad-hoc code sign
        # macOS only delivers UNUserNotificationCenter notifications for signed
        # apps. We have no Apple Developer identity in CI, so ad-hoc sign (`-`)
        # with hardened runtime — enough for local notifications once the user
        # clears the quarantine flag.
        run: |
          APP_PATH="$(find build/export -maxdepth 1 -name '*.app' -print -quit)"
          codesign --force --deep --options runtime --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: NtfyMac-app
          path: build/export/*.app
          if-no-files-found: error

      - name: Package DMG
        run: |
          APP_PATH="$(find build/export -maxdepth 1 -name '*.app' -print -quit)"
          bash scripts/make_dmg.sh "$APP_PATH" build/NtfyMac.dmg "Ntfy for Mac"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NtfyMac-dmg
          path: build/NtfyMac.dmg
          if-no-files-found: error
