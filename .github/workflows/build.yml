name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Finish a main release upload before the next push can replace its assets.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build NtfyMac (macOS)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run deterministic smoke tests
        run: bash scripts/run_smoke_tests.sh

      - name: Build (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project NtfyMac.xcodeproj \
            -scheme NtfyMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build \
            | xcbeautify || \
          xcodebuild \
            -project NtfyMac.xcodeproj \
            -scheme NtfyMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

  archive:
    name: Archive .app artifact
    runs-on: macos-14
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Resolve build version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            MARKETING_VERSION="${VERSION#v}"
          else
            VERSION="dev-${GITHUB_RUN_NUMBER}"
            MARKETING_VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building artifact version: $VERSION"

      - name: Build Release (unsigned) into export dir
        run: |
          set -o pipefail
          xcodebuild \
            -project NtfyMac.xcodeproj \
            -scheme NtfyMac \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            NTFY_BUILD_VERSION_LABEL="${{ steps.version.outputs.version }}" \
            clean build

      - name: Stage app bundle
        run: |
          mkdir -p build/export
          APP_PATH="$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          echo "Found: $APP_PATH"
          cp -R "$APP_PATH" build/export/

      - name: Ad-hoc code sign
        # macOS only delivers UNUserNotificationCenter notifications for signed
        # apps. We have no Apple Developer identity in CI, so ad-hoc sign (`-`)
        # with hardened runtime — enough for local notifications once the user
        # clears the quarantine flag.
        run: |
          APP_PATH="$(find build/export -maxdepth 1 -name '*.app' -print -quit)"
          codesign --force --deep --options runtime --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: NtfyMac-app
          path: build/export/*.app
          if-no-files-found: error

      - name: Package DMG
        run: |
          APP_PATH="$(find build/export -maxdepth 1 -name '*.app' -print -quit)"
          bash scripts/make_dmg.sh "$APP_PATH" build/NtfyMac.dmg "Ntfy for Mac"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NtfyMac-dmg
          path: build/NtfyMac.dmg
          if-no-files-found: error

  publish:
    name: Publish latest prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that this is still the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$MAIN_SHA" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release: main has advanced beyond $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download the tested DMG
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: NtfyMac-dmg
          path: build/release

      - name: Move the latest tag to this build
        if: steps.current.outputs.publish == 'true'
        run: |
          test -s build/release/NtfyMac.dmg
          git tag --force latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Publish or update latest prerelease
        if: steps.current.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Ntfy for Mac - Latest build
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          fail_on_unmatched_files: true
          files: build/release/NtfyMac.dmg
          body: |
            Automatically updated after a successful push build on `main`.

            - App version: `dev-${{ github.run_number }}`
            - Source commit: ${{ github.sha }}
            - [Build and test results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Download `NtfyMac.dmg` below, open it, and drag Ntfy into Applications.
            This development build uses ad-hoc signing, without an Apple Developer ID certificate.
