name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Finish a main release upload before the next push can replace its assets.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build NtfyMac (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run deterministic smoke tests
        run: bash scripts/run_smoke_tests.sh

      - name: Build (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project NtfyMac.xcodeproj \
            -scheme NtfyMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build \
            | xcbeautify || \
          xcodebuild \
            -project NtfyMac.xcodeproj \
            -scheme NtfyMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

  archive:
    name: Archive .app artifact
    runs-on: macos-15
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      - name: Resolve build version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            MARKETING_VERSION="${VERSION#v}"
          else
            VERSION="dev-${GITHUB_RUN_NUMBER}"
            MARKETING_VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building artifact version: $VERSION"

      - name: Build Release (unsigned) into export dir
        run: |
          set -o pipefail
          xcodebuild \
            -project NtfyMac.xcodeproj \
            -scheme NtfyMac \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            NTFY_BUILD_VERSION_LABEL="${{ steps.version.outputs.version }}" \
            clean build

      - name: Stage app bundle
        run: |
          mkdir -p build/export
          APP_PATH="$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          echo "Found: $APP_PATH"
          cp -R "$APP_PATH" build/export/

      - name: Verify universal macOS 13 app
        run: |
          APP_PATH="$(find build/export -maxdepth 1 -name '*.app' -print -quit)"
          bash scripts/verify_macos_app.sh "$APP_PATH"

      - name: Ad-hoc code sign
        # macOS only delivers UNUserNotificationCenter notifications for signed
        # apps. We have no Apple Developer identity in CI, so ad-hoc sign (`-`)
        # with hardened runtime — enough for local notifications once the user
        # clears the quarantine flag.
        run: |
          APP_PATH="$(find build/export -maxdepth 1 -name '*.app' -print -quit)"
          codesign --force --deep --options runtime --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: NtfyMac-app
          path: build/export/*.app
          if-no-files-found: error

      - name: Package DMG
        run: |
          APP_PATH="$(find build/export -maxdepth 1 -name '*.app' -print -quit)"
          bash scripts/make_dmg.sh "$APP_PATH" build/NtfyMac.dmg "Ntfy for Mac"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NtfyMac-dmg
          path: build/NtfyMac.dmg
          if-no-files-found: error

  validate_exact_intel_artifact:
    name: Launch exact #59 DMG on Intel macOS 15
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 59 && github.head_ref == 'fix/macos-ci-runner-54'
    runs-on: macos-15-intel
    timeout-minutes: 8
    permissions:
      actions: read
    steps:
      - name: Verify provenance and download exact DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          [[ "$(sw_vers -productVersion)" == 15.* ]]
          uname -m
          sw_vers -productVersion
          metadata="$(gh api repos/wangty163/mac_ntfy/actions/artifacts/14611247441)"
          jq -e '
            .id == 14611247441 and .name == "NtfyMac-dmg" and .expired == false and
            .workflow_run.id == 44697186542 and
            .workflow_run.head_sha == "77cf3be3b330715e8744950abcf2d53fec922b51" and
            .digest == "sha256:6578ea2b5d076716fa56b8aa8bce13c55d3ed0a5a706c4bae5262cefcc746360"
          ' <<< "$metadata"
          gh api repos/wangty163/mac_ntfy/actions/artifacts/14611247441/zip > "$RUNNER_TEMP/ntfy-intel.zip"
          printf '%s  %s\n' '6578ea2b5d076716fa56b8aa8bce13c55d3ed0a5a706c4bae5262cefcc746360' "$RUNNER_TEMP/ntfy-intel.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/ntfy-intel.zip" -d "$RUNNER_TEMP/ntfy-intel"
      - name: Launch the packaged app without installing it
        run: |
          set -euo pipefail
          mountdir="$(mktemp -d)"
          logfile="$RUNNER_TEMP/ntfy-intel-launch.log"
          pid=''
          mounted=0
          cleanup() {
            if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
            cat "$logfile" 2>/dev/null || true
            if [[ "$mounted" == 1 ]]; then hdiutil detach "$mountdir"; fi
            rmdir "$mountdir"
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mountdir" "$RUNNER_TEMP/ntfy-intel/NtfyMac.dmg"
          mounted=1
          app="$(find "$mountdir" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          /usr/bin/arch -x86_64 "$app/Contents/MacOS/$executable" > "$logfile" 2>&1 &
          pid=$!
          sleep 12
          kill -0 "$pid"
          test -n "$(ps -p "$pid" -o stat= | grep -v Z)"
          echo 'Packaged app launched natively on Intel macOS 15 and remained running for 12 seconds.'

  publish:
    name: Publish latest prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that this is still the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$MAIN_SHA" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release: main has advanced beyond $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download the tested DMG
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: NtfyMac-dmg
          path: build/release

      - name: Move the latest tag to this build
        if: steps.current.outputs.publish == 'true'
        run: |
          test -s build/release/NtfyMac.dmg
          git tag --force latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Publish or update latest prerelease
        if: steps.current.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Ntfy for Mac - Latest build
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          fail_on_unmatched_files: true
          files: build/release/NtfyMac.dmg
          body: |
            Automatically updated after a successful push build on `main`.

            - App version: `dev-${{ github.run_number }}`
            - Source commit: ${{ github.sha }}
            - [Build and test results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Download `NtfyMac.dmg` below, open it, and drag Ntfy into Applications.
            This development build uses ad-hoc signing, without an Apple Developer ID certificate.
